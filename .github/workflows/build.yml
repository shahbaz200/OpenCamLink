name: Build OpenCamLink APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o OpenCamLink-source-v0.2-ready-for-cloud-build.zip
          ls -la OpenCamLink

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: OpenCamLink
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp OpenCamLink/app/build/outputs/apk/debug/app-debug.apk output/OpenCamLink-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCamLink-APK
          path: output/OpenCamLink-v0.2.apk
